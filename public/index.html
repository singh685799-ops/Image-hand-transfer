<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Image to Files Transfer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📤 Image to Files Transfer</h1>
    <p>Transfer images between devices using hand gestures</p>
  </header>

  <!-- Mode Tabs -->
  <div class="tabs">
    <button id="tabTransfer" class="tab active">Transfer Mode</button>
    <button id="tabReceive" class="tab">Receive Mode</button>
  </div>

  <!-- Transfer Mode Panel -->
  <section id="transferPanel" class="panel active">
    <div class="upload-section">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button id="uploadBtn" class="primary-btn">📁 Choose Image</button>
      <img id="imagePreview" class="preview hidden" alt="Selected image">
    </div>
    <button id="openCameraBtn" class="primary-btn">📷 Open Camera</button>
    <div class="camera-container hidden" id="transferCameraContainer">
      <video id="transferVideo" playsinline></video>
      <canvas id="transferCanvas" class="overlay-canvas"></canvas>
      <button id="switchCameraTransfer" class="secondary-btn">🔄 Switch Camera</button>
    </div>
    <div id="transferStatus" class="status">Select an image and open camera. Show open palm to transfer.</div>
  </section>

  <!-- Receive Mode Panel -->
  <section id="receivePanel" class="panel">
    <div class="camera-container hidden" id="receiveCameraContainer">
      <video id="receiveVideo" playsinline></video>
      <canvas id="receiveCanvas" class="overlay-canvas"></canvas>
      <button id="switchCameraReceive" class="secondary-btn">🔄 Switch Camera</button>
    </div>
    <div id="receiveStatus" class="status">Camera will start automatically. Show open palm to receive.</div>
    <div id="receivedImageContainer" class="hidden">
      <img id="receivedImage" class="preview" alt="Received image">
      <a id="saveImageBtn" download="received_image.jpg" class="primary-btn">💾 Save Image</a>
    </div>
  </section>

  <!-- Countdown Overlay (shared) -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-content">
      <div class="spinner"></div>
      <div id="overlayText">Transferring...</div>
      <div id="overlayTimer" class="timer">15</div>
    </div>
  </div>

  <!-- MediaPipe Hands CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
